<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Convite Misterioso</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #ff7e5f, #feb47b);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }
    p {
      font-size: 1rem;
      max-width: 320px;
      line-height: 1.4;
    }
    button {
      background: #fff;
      color: #ff7e5f;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      margin-top: 25px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.1);
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-20px);}
      60% {transform: translateY(-10px);}
    }
    .emoji {
      font-size: 2rem;
      display: inline-block;
      animation: spin 4s linear infinite;
    }
    @keyframes spin {
      0% {transform: rotate(0deg);}
      100% {transform: rotate(360deg);}
    }
    .blob {
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      filter: blur(80px);
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% {transform: translateY(0) scale(1);}
      50% {transform: translateY(-20px) scale(1.05);}
    }
  </style>
</head>
<body>
  <div class="blob" style="top:-100px; left:-80px;"></div>
  <div class="blob" style="bottom:-120px; right:-60px;"></div>
  <h1>🎉 Convite para asdfasdf asdfa asdfasdf asdfasdfasdf 🎈</h1>
  <p>
    Ninguém sabe o motivo, nem o horário, nem o local.<br>
    Mas o convite tá feito, e é sério (ou quase).<br>
    Compareça com disposição para... sei lá o quê 🤪
  </p>
  <div class="emoji">💫</div>
  <button onclick="alert('Você aceitou o convite misterioso! 🌀')">Aceitar convite</button>
</body>
</html>
